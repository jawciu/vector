# Nightly reset of the public demo portfolio at vector.quest.
#
# vector.quest auto-signs visitors into a shared demo account with write access,
# so anyone can rearrange the board. This job restores the seeded portfolio every
# night: it deletes ONLY the 12 companies created by seed-portfolio-growth.js
# (identified by logoUrl IS NOT NULL) and reseeds them with dates relative to the
# run date. The original legacy corpus is never touched.
#
# Costs nothing (no API calls). Takes ~1 minute. Safe to run by hand from the
# Actions tab via workflow_dispatch if a visitor makes a mess mid-day.

name: Reset Demo Data

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

# Never let two resets overlap — a half-deleted portfolio racing a reseed would
# leave duplicate companies.
concurrency:
  group: reset-demo-data
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Reset and reseed demo portfolio
        # Only DATABASE_URL: the seed talks to the pooler through the Prisma
        # adapter. Passing an unset DIRECT_DATABASE_URL would hand prisma.config.ts
        # an empty string, which its `??` fallback does not catch.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx prisma/reset-demo-data.js --write
