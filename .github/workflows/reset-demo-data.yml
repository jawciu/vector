# Nightly reset of the public demo portfolio at vector.quest.
#
# vector.quest auto-signs visitors into a shared demo account with write access,
# so anyone can rearrange the board. This job restores the seeded portfolio every
# night: it deletes ONLY the 12 companies created by seed-portfolio-growth.js
# (identified by logoUrl IS NOT NULL) and reseeds them with dates relative to the
# run date. The original legacy corpus is never touched.
#
# Costs nothing (no API calls). Takes ~1 minute. Safe to run by hand from the
# Actions tab via workflow_dispatch if a visitor makes a mess mid-day.

name: Reset Demo Data

on:
  # SCHEDULE DISABLED (2026-07-10). Deleting the seeded onboardings cascade-deletes
  # every PendingAIChange and sets ExternalEvent.onboardingId to NULL, so a nightly
  # reset would destroy the AI drafts generated from the 18 injected meetings and
  # leave the meeting events stranded. Regenerating them costs ~$1 of Anthropic
  # usage per run, which is not acceptable nightly.
  #
  # Re-enable once reset-demo-data.js restores the meetings + drafts from a
  # snapshot instead of reseeding from scratch. Until then the reset is manual:
  # run it from the Actions tab if a visitor makes a mess (it will drop the
  # meetings, which then need `node scripts/inject-meetings.js` to rebuild).
  #
  # schedule:
  #   - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

# Never let two resets overlap — a half-deleted portfolio racing a reseed would
# leave duplicate companies.
concurrency:
  group: reset-demo-data
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prisma.config.ts resolves DIRECT_DATABASE_URL eagerly and throws if it is
      # missing, so both names are mapped to the one secret that exists. Nothing
      # connects through DIRECT here (generate is offline; the seed uses the
      # pooler via DATABASE_URL), so pointing them at the same URL is safe.
      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Reset and reseed demo portfolio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx prisma/reset-demo-data.js --write
